name: MyHealthTeam
description: >-
  MyHealthTeam operates condition-specific patient social networks that connect roughly 4
  million members across 80+ chronic-condition communities (from multiple sclerosis and
  rheumatoid arthritis to autism and cancer) with peer support, practical advice, and trusted
  health information to help them better manage life with a chronic condition. It is a
  consumer-facing web and mobile platform rather than a developer-oriented API provider; as of
  January 2025 MyHealthTeam is a Swoop company. This API Evangelist profile was surfaced as a
  500 Global portfolio company. Enrichment found no public developer API, developer portal,
  OpenAPI, SDKs, or /.well-known discovery surface on myhealthteam.com — only the consumer
  marketing site (which now redirects its blog to swoop.com), so this entry carries identity
  and domain-security signal only.
